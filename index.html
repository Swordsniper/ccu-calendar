<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CCU Events Calendar - Auto Updating</title>
  <style>
    :root {
      --primary: #002b49;
      --accent: #0072ce;
      --bg: #f4f6f9;
      --card-bg: #ffffff;
      --text: #333333;
      --border: #e0e0e0;
      --success: #2e7d32;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 20px; }

    .header { text-align: center; margin-bottom: 25px; }
    .header h1 { color: var(--primary); font-size: 2rem; }
    
    .status-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--card-bg);
      border-radius: 8px;
      padding: 10px 20px;
      max-width: 1200px;
      margin: 0 auto 20px auto;
      font-size: 0.85rem;
      border-left: 4px solid var(--accent);
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }

    .sync-btn {
      background: var(--accent);
      color: white;
      border: none;
      padding: 6px 12px;
      border-radius: 4px;
      cursor: pointer;
      font-size: 0.8rem;
    }

    .container {
      display: grid;
      grid-template-columns: 1fr 350px;
      gap: 20px;
      max-width: 1200px;
      margin: 0 auto;
    }

    @media (max-width: 900px) { .container { grid-template-columns: 1fr; } }

    .card {
      background: var(--card-bg);
      border-radius: 8px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.06);
    }

    .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
    .weekdays { display: grid; grid-template-columns: repeat(7, 1fr); text-align: center; font-weight: bold; color: var(--primary); padding-bottom: 10px; border-bottom: 2px solid var(--border); }
    .days-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 5px; margin-top: 10px; }
    
    .day { min-height: 95px; background: #fafafa; border: 1px solid var(--border); border-radius: 4px; padding: 6px; font-size: 0.85rem; display: flex; flex-direction: column; }
    .day.empty { background: transparent; border: none; }
    .day-number { font-weight: bold; margin-bottom: 4px; }
    
    .event-pill {
      background: var(--accent);
      color: white;
      padding: 3px 6px;
      border-radius: 3px;
      font-size: 0.72rem;
      margin-bottom: 3px;
      text-decoration: none;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      display: block;
    }

    .event-list { max-height: 400px; overflow-y: auto; }
    .event-item { padding: 10px 0; border-bottom: 1px solid var(--border); }
    .event-item:last-child { border-bottom: none; }
    .event-title { font-weight: bold; color: var(--primary); text-decoration: none; display: block; }
    .event-meta { font-size: 0.8rem; color: #666; margin-top: 2px; }

    form { display: flex; flex-direction: column; gap: 10px; }
    input, button { padding: 10px; border: 1px solid var(--border); border-radius: 4px; }
    button.submit-btn { background: var(--primary); color: white; border: none; font-weight: bold; cursor: pointer; }
  </style>
</head>
<body>

  <div class="header">
    <h1>CCU Live Events Calendar</h1>
  </div>

  <div class="status-bar">
    <span id="lastUpdated">Syncing with live feed...</span>
    <button class="sync-btn" onclick="fetchLiveEvents()">Sync Now</button>
  </div>

  <div class="container">
    <div class="card">
      <div class="calendar-header">
        <h2 id="monthYearTitle">October 2026</h2>
      </div>
      <div class="weekdays">
        <div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
      </div>
      <div class="days-grid" id="calendarDays"></div>
    </div>

    <div class="sidebar">
      <div class="card" style="margin-bottom: 20px;">
        <h2>Add Custom Event</h2>
        <form id="eventForm">
          <input type="text" id="title" placeholder="Event Title" required>
          <input type="number" id="day" placeholder="Day of Month (1-31)" min="1" max="31" required>
          <input type="text" id="time" placeholder="Time (e.g. 7:00 pm)" required>
          <input type="text" id="location" placeholder="Location">
          <input type="url" id="link" placeholder="URL (optional)">
          <button type="submit" class="submit-btn">Add Event</button>
        </form>
      </div>

      <div class="card">
        <h2>Upcoming Events</h2>
        <div class="event-list" id="eventList"></div>
      </div>
    </div>
  </div>

  <script>
    // Initial fallback dataset
    let events = [
      { day: 1, title: "REJOICE — A Faculty Recital", time: "7:00 pm - 8:30 pm", location: "Colorado Christian University", link: "https://www.ccu.edu/events/2026/10/faculty-recital-moreland-jardon/index.html" },
      { day: 8, title: "Two-Day Preview", time: "8:30 am - 2:30 pm", location: "Colorado Christian University", link: "https://www.ccu.edu/events/2026/10/two-day-preview/index.html" },
      { day: 16, title: "Parent and Family Weekend", time: "11:00 am - 9:30 pm", location: "Colorado Christian University", link: "https://www.ccu.edu/events/2026/10/family-weekend/index.html" },
      { day: 16, title: "Fall Symphonic Band Concert", time: "7:00 pm - 8:30 pm", location: "CCU Armstrong Center", link: "https://www.ccu.edu/events/2026/10/fall-symphonic-band-concert/" },
      { day: 19, title: "Faith and Freedom Series: Joseph Loconte", time: "7:00 pm - 8:30 pm", location: "Colorado Christian University", link: "https://www.ccu.edu/events/2026/10/faith-freedom-loconte/index.html" },
      { day: 21, title: "Fall Play: Antigone", time: "7:00 pm", location: "CCU Armstrong Center", link: "https://www.ccu.edu/events/2026/10/antigone/" },
      { day: 30, title: "Fall Choral Concert", time: "7:00 pm - 9:00 pm", location: "CCU Armstrong Center", link: "https://www.ccu.edu/events/2026/10/fall-choral-concert/" }
    ];

    async function fetchLiveEvents() {
      const statusEl = document.getElementById('lastUpdated');
      statusEl.textContent = 'Checking for daily updates...';

      try {
        // Fetch fresh JSON generated by daily background job
        const response = await fetch('./events.json?cachebuster=' + new Date().getTime());
        if (response.ok) {
          const liveData = await response.json();
          if (Array.isArray(liveData) && liveData.length > 0) {
            events = liveData;
            localStorage.setItem('ccu_events', JSON.stringify(events));
          }
        }
      } catch (err) {
        console.log('Using local or cached event data.');
        const cached = localStorage.getItem('ccu_events');
        if (cached) events = JSON.parse(cached);
      }

      const now = new Date();
      statusEl.textContent = `Auto-updated: ${now.toLocaleDateString()} at ${now.toLocaleTimeString()}`;
      renderCalendar();
    }

    function renderCalendar() {
      const grid = document.getElementById('calendarDays');
      const list = document.getElementById('eventList');
      grid.innerHTML = '';
      list.innerHTML = '';

      const startOffset = 4; // Oct 2026 starts Thursday
      const totalDays = 31;

      for (let i = 0; i < startOffset; i++) {
        const empty = document.createElement('div');
        empty.className = 'day empty';
        grid.appendChild(empty);
      }

      for (let day = 1; day <= totalDays; day++) {
        const dayDiv = document.createElement('div');
        dayDiv.className = 'day';
        
        const dayNum = document.createElement('div');
        dayNum.className = 'day-number';
        dayNum.textContent = day;
        dayDiv.appendChild(dayNum);

        const dayEvents = events.filter(e => parseInt(e.day) === day);
        dayEvents.forEach(e => {
          const pill = document.createElement('a');
          pill.className = 'event-pill';
          pill.textContent = e.title;
          pill.href = e.link || '#';
          pill.target = '_blank';
          pill.title = `${e.title} (${e.time})`;
          dayDiv.appendChild(pill);
        });

        grid.appendChild(dayDiv);
      }

      events.sort((a, b) => a.day - b.day).forEach(e => {
        const item = document.createElement('div');
        item.className = 'event-item';
        item.innerHTML = `
          <a class="event-title" href="${e.link || '#'}" target="_blank">${e.title}</a>
          <div class="event-meta">📅 Oct ${e.day}, 2026 | ⏰ ${e.time}</div>
          <div class="event-meta">📍 ${e.location || 'CCU Campus'}</div>
        `;
        list.appendChild(item);
      });
    }

    document.getElementById('eventForm').addEventListener('submit', function(e) {
      e.preventDefault();
      const newEvent = {
        title: document.getElementById('title').value,
        day: parseInt(document.getElementById('day').value),
        time: document.getElementById('time').value,
        location: document.getElementById('location').value || 'CCU Campus',
        link: document.getElementById('link').value || '#'
      };
      events.push(newEvent);
      localStorage.setItem('ccu_events', JSON.stringify(events));
      renderCalendar();
      this.reset();
    });

    // Automatically check for daily updates on page load and every midnight
    fetchLiveEvents();
    setInterval(fetchLiveEvents, 1000 * 60 * 60 * 12); // Re-sync twice daily
  </script>
</body>
</html>
