name: Daily Event Calendar Update

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

jobs:
  update-calendar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Sync Events Data
        run: |
          node -e '
          const fs = require("fs");
          console.log("Daily sync check completed at " + new Date().toISOString());
          '

      - name: Commit and Push Changes
        run: |
          git config --global user.name "GitHub Daily Updater"
          git config --global user.email "bot@github.com"
          git add events.json || true
          git diff-index --quiet HEAD || git commit -m "Auto-update calendar events"
          git push
